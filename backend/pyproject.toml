[project]
name = "music-video-studio"
version = "0.1.0"
description = "Lyric-synced three.js music videos: analysis pipeline, live preview, timeline editor, chat via Claude Code"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "numpy>=2.0",
    "imageio-ffmpeg>=0.5",
]

[project.scripts]
studio = "studio.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["studio"]
