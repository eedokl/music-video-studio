<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Office Software Scenes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;600;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="stage3d"></div>
    <div id="scene" class="scene dark"></div>
    <div id="labels"></div>

    <div id="hud">
      <button id="play">Play</button>
      <div id="bar"><div id="fill"></div></div>
      <span id="time">0:00</span>
    </div>

    <div id="start">
      <div class="card-start">
        <div class="mono dim">TECHNIQUE DEMO · OFFICE SCENES</div>
        <h1>Welcome to <span>Platform Life</span></h1>
        <p>36 scenes from the daily life of a cloud platform team.</p>
        <button id="go">▶ Play video</button>
        <p class="mono dim keys">Space play/pause · ←/→ seek 5 s · F fullscreen</p>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
