<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stadium Concert Broadcast</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="stage3d"></div>
    <div id="vignette"></div>
    <div id="scene"></div>
    <div id="live"></div>
    <div id="flash"></div>
    <div id="grain"></div>

    <div id="hud">
      <button id="play">Play</button>
      <div id="bar"><div id="fill"></div></div>
      <span id="time">0:00</span>
    </div>

    <div id="start">
      <div class="card-start">
        <div class="mono dim">LIVE · STADIUM BROADCAST</div>
        <h1>The <span>Show</span></h1>
        <p>A lyric video staged as a live concert broadcast.</p>
        <button id="go">▶ Play video</button>
        <p class="mono dim keys">Space play/pause · ←/→ seek 5 s · F fullscreen</p>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
