<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stage Dodge</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Oswald:wght@500;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="stage"></div>
    <div id="caption"></div>

    <div id="title">
      <div class="small">Lyric Video Demo</div>
      <h1>Welcome to<br /><span>the Noise</span></h1>
      <div class="subtitle">Stage Dodge</div>
    </div>

    <div id="credits">
      <h2>Welcome to the Noise</h2>
      <p>Keep it moving. Keep it loud.</p>
    </div>

    <div id="hud">
      <button id="play">Play</button>
      <div id="bar"><div id="fill"></div></div>
      <span id="time">0:00</span>
    </div>

    <div id="start">
      <div class="card">
        <div class="tag">Stage Dodge</div>
        <h1>Welcome to<br /><span>the Noise</span></h1>
        <p>One singer. One stage. Every hazard word in the lyrics flying at her.</p>
        <button id="go">▶ Play video</button>
        <p class="keys">Space play/pause · ←/→ seek 5 s · F fullscreen · H hide captions</p>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
